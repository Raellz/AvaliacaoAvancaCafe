<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avança Café - Apuração e Ranking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Quadro de Apuração</h1>
      <p>Ranking Geral das Startups em Tempo Real</p>
      <div class="nav-links">
        <a href="index.html">📝 Voltar para Avaliação</a>
      </div>
    </header>

    <div class="filter-tabs">
      <button class="tab-btn active" data-campus="paraiso">Paraíso</button>
      <button class="tab-btn" data-campus="sede">UFLA Sede (Lavras)</button>
      <button class="tab-btn" data-campus="todos">Unificado</button>
    </div>

    <div class="card">
      <table class="ranking-table">
        <thead>
          <tr>
            <th>Pos.</th>
            <th>Startup</th>
            <th>Polo</th>
            <th>Avaliações</th>
            <th>Média Geral</th>
          </tr>
        </thead>
        <tbody id="rankingBody">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--text-muted);">Carregando resultados...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="ranking.js"></script>
</body>
</html>
